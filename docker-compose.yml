services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oeb
      POSTGRES_PASSWORD: oeb
      POSTGRES_DB: oeb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oeb -d oeb"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
