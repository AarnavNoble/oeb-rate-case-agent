[project]
name = "oeb"
version = "0.1.0"
description = "Rate-case research agent over Ontario Energy Board filings"
authors = [
    { name = "Aarnav Noble", email = "aarnavnoble14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "temporalio>=1.34.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "evals"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
